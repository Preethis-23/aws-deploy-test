name: Deploy Website using Docker to Amazon EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy Container
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: SSH Deploy Files to EC2 Instance
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "./" # Upload all files (including Dockerfile and web folder)
          REMOTE_HOST: ${{ secrets.EC2_HOST }}
          REMOTE_USER: ${{ secrets.EC2_USERNAME }}
          TARGET: "/home/ubuntu/aws-deploy-test" # Destination folder on server
          EXCLUDE: "/.git/, /.github/"

      - name: Build and Run Docker Container on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Building new Docker image on the server..."
            sudo docker build -t aws-deploy-test /home/ubuntu/aws-deploy-test
            
            echo "Stopping old container if running..."
            sudo docker stop aws-deploy-container || true
            sudo docker rm aws-deploy-container || true
            
            echo "Starting new container on port 80..."
            sudo docker run -d --name aws-deploy-container -p 80:80 aws-deploy-test
            
            echo "Deployment finished successfully!"
